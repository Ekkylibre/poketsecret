<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="20" y1="8" x2="82" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6c877" />
      <stop offset="1" stop-color="#c97f1f" />
    </linearGradient>
    <clipPath id="orbClip">
      <circle cx="50" cy="50" r="30" />
    </clipPath>
    <mask id="ringGapMask">
      <rect x="0" y="0" width="100" height="100" fill="#fff" />
      <rect x="46" y="6" width="8" height="12" fill="#000" />
      <rect x="46" y="82" width="8" height="12" fill="#000" />
      <rect x="82" y="46" width="12" height="8" fill="#000" />
      <rect x="6" y="46" width="12" height="8" fill="#000" />
    </mask>
  </defs>

  <!-- anneau radar en orbite autour de la bille, verrouillé sur la cible ;
       vides au nord/sud/est/ouest découpés au masque : bords droits et
       parallèles plutôt qu'un arc tronqué. Rayon 38 (bord intérieur 34) pour un écart
       net avec le bord de la bille (30) : l'anneau tourne autour, pas à travers. -->
  <g mask="url(#ringGapMask)" fill="none">
    <circle cx="50" cy="50" r="38" stroke="#12141a" stroke-width="8" />
    <circle cx="50" cy="50" r="38" stroke="#f2a93c" stroke-width="5" />
  </g>

  <g clip-path="url(#orbClip)">
    <rect x="0" y="0" width="100" height="50" fill="url(#goldGrad)" />
    <rect x="0" y="50" width="100" height="50" fill="#12141a" />
    <rect x="0" y="45" width="100" height="7" fill="#c97f1f" />
  </g>
  <circle cx="50" cy="50" r="30" fill="none" stroke="#12141a" stroke-width="1.6" />
  <path d="M34.3 31.6a19.1 19.1 0 0 1 14.3-6.8" stroke="#f6f1e6" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.32" />
  <circle cx="50" cy="50" r="9" fill="#12141a" stroke="#c97f1f" stroke-width="1.8" />
  <circle cx="50" cy="50" r="4.8" fill="#f2a93c" />
</svg>
